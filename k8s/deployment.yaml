apiVersion: apps/v1
kind: Deployment
metadata:
  name: day304-api
  namespace: day304
spec:
  replicas: 2
  selector:
    matchLabels:
      app: day304-api
  template:
    metadata:
      labels:
        app: day304-api
    spec:
      containers:
        - name: api
          image: day304-observability:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
